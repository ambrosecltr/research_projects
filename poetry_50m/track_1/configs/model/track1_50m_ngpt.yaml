# 54,596,096 parameters: nGPT's separate input/output embeddings, normalized
# projection axes, and learned nGPT scale vectors.
architecture: ngpt
vocab_size: 8192
max_seq_len: 1024
d_model: 512
n_layers: 11
n_heads: 8
ffn_dim: 2048
dropout: 0.0
rope_base: 10000.0
rope_fraction: 1.0
norm_epsilon: 0.000001
linear_bias: false
tie_embeddings: false
ignore_index: -100
