name: Track 2

on:
  pull_request:
    paths:
      - "track_2/**"
      - ".github/workflows/track2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track_2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: track_2/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q genome tests
      - name: Test
        run: python -m pytest -q
