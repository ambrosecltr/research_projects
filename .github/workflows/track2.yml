name: Track 2

on:
  pull_request:
    paths:
      - "track_2/**"
      - ".github/workflows/track2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track_2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: track_2/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev,evaluation]'
      - name: Compile
        run: python -m compileall -q genome tests
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee ../track2-pytest.log
      - name: Pack tested source
        if: always()
        run: tar -czf ../track2-source.tgz genome tests pyproject.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track2-validation
          path: |
            track2-pytest.log
            track2-source.tgz
          retention-days: 3
