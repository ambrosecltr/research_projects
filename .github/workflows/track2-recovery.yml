name: Track 2 GENOME recovery

on:
  push:
    branches:
      - agent/genome-recovery
  pull_request:
    paths:
      - "track_2/**"
      - ".github/workflows/track2-recovery.yml"

permissions:
  contents: read

jobs:
  test-track-2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track_2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: track_2/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q genome tests
      - name: Test
        run: python -m pytest -q
      - name: Export source snapshot
        if: always()
        run: tar -czf ../track2-source.tgz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track2-source
          path: track2-source.tgz
          retention-days: 3
