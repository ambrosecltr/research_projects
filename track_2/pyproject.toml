[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genome-track2"
version = "0.2.0"
description = "GENOME: Generative Endpoint Neural Operator for Model Emission"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "GENOME research project"}]
dependencies = [
  "torch>=2.4,<2.5",
  "numpy>=1.26,<2",
  "safetensors>=0.4.3,<0.5",
  "huggingface-hub>=0.27,<0.28",
  "httpx>=0.27,<0.28",
  "transformers>=4.46,<4.47",
  "PyYAML>=6.0",
  "tokenizers>=0.20,<0.21",
  "typer>=0.12",
]

[project.optional-dependencies]
analysis = ["scipy>=1.11", "matplotlib>=3.8", "pandas>=2.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
evaluation = ["datasets>=3.1,<3.2", "lm-eval==0.4.7", "chardet>=5,<6"]

[project.scripts]
genome = "genome.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["genome*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
