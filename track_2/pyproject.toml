[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genome-track2"
version = "1.0.0"
description = "GENOME: compile model lives into compact executable model programs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "GENOME research project"}]
dependencies = [
  "torch>=2.6,<3",
  "numpy>=1.26",
  "safetensors>=0.4.3",
  "huggingface-hub>=0.27",
  "transformers>=4.57,<5",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
evaluation = ["datasets>=3.1", "lm-eval>=0.4.7", "chardet>=5,<6"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
genome = "genome.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["genome*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
