# 8,335,008 trainable parameters in the conventional GPT implementation.
# This preserves Track 1's tied 8,192-token embedding and 1,024-token context.
architecture: gpt
vocab_size: 8192
max_seq_len: 1024
d_model: 288
n_layers: 6
n_heads: 6
ffn_dim: 768
dropout: 0.0
rope_base: 10000.0
rope_fraction: 1.0
norm_epsilon: 0.000001
linear_bias: false
tie_embeddings: true
ignore_index: -100
