[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poetry50m"
version = "0.1.0"
description = "Track 1: endpoint-informed training experiments for an 8M poetry model"
requires-python = ">=3.11"
dependencies = [
    "cerebras-cloud-sdk>=1.91.0",
    "huggingface-hub>=0.27",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "PyYAML>=6.0.2",
    "tokenizers>=0.20",
    "torch>=2.4",
]

[project.scripts]
poetry50m = "poetry50m.cli:main"

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6", "types-PyYAML>=6.0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true
